<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Edward Khouy-Ly · Photographs</title>
  <meta name="description" content="A collection of Edward Khouy-Ly's favourite photographs, year by year and month by month.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="site-header">
    <a class="brand" href="#top">Edward Khouy-Ly</a>
    <nav class="years" id="year-nav" aria-label="Years"></nav>
  </header>

  <section class="hero" id="top">
    <div class="hero-slides" id="hero-slides"></div>
    <div class="hero-shade"></div>
    <div class="hero-text">
      <p class="eyebrow">Photographs</p>
      <h1>Edward<br><em>Khouy-Ly</em></h1>
      <p class="hero-sub" id="hero-sub">Favourite frames, kept year by year.</p>
    </div>
    <a class="hero-cue" href="#gallery" aria-label="Scroll to photos"><span></span></a>
  </section>

  <main>
    <div id="gallery"></div>
  </main>

  <footer class="site-footer">
    <p class="footer-name">Edward Khouy-Ly</p>
    <p>© <span id="year"></span> · <a href="#top">Back to top</a></p>
  </footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top">
      <span class="lb-count" id="lb-count"></span>
      <button class="lb-close" aria-label="Close">×</button>
    </div>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next photo">›</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
