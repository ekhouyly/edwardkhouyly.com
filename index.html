  <meta name="description" content="A collection of Edward Khouy-Ly's favourite photographs, year by year and month by month.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Edward Khouy-Ly · Photographs">
  <meta property="og:description" content="Favourite photographs from Korea, Japan, the Maritimes and everyday life, by @eklphotos.">
  <meta property="og:url" content="https://ekhouyly.github.io/edwardkhouyly.com/">
  <meta property="og:image" content="https://ekhouyly.github.io/edwardkhouyly.com/og.jpg?v=1792441462">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Family walking toward the rock arches at Hopewell Rocks">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=a25ebc61">
</head>
<body>
  <header class="site-header" id="site-header">
    <a class="brand" href="#top">Edward Khouy-Ly</a>
    <nav class="years" id="year-nav" aria-label="Years"></nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to black background">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="hero" id="top">
    <div class="hero-slides" id="hero-slides"></div>
    <div class="hero-shade"></div>
    <div class="hero-text">
      <p class="eyebrow">Photographs</p>
      <h1>Edward<br><em>Khouy-Ly</em></h1>
      <p class="hero-sub" id="hero-sub">Favourite frames, kept year by year.</p>
    </div>
    <a class="hero-cue" href="#gallery" aria-label="Scroll to photos"><span></span></a>
  </section>

  <main>
    <section class="trips" id="trips" hidden>
      <div class="trips-head">
        <h2>Trips</h2>
      </div>
      <div class="trip-cards" id="trip-cards"></div>
    </section>
    <div id="gallery"></div>
  </main>

  <footer class="site-footer" id="about">
    <p class="about-eyebrow">About</p>
    <h2 class="about-title">Hi, I'm <em>Edward.</em></h2>
    <p class="about-text">I photograph trips, friends and everyday moments, mostly on a Fujifilm camera. These are the frames I keep coming back to.</p>
    <div class="about-links">
      <a class="about-link" href="https://www.instagram.com/eklphotos/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="currentColor"/></svg>
        @eklphotos
      </a>
    </div>
    <p class="footer-small">© <span id="year"></span> Edward Khouy-Ly · <a href="#top">Back to top</a></p>
  </footer>

  <section class="trip-page" id="trip-page" hidden aria-label="Trip">
    <div class="trip-bar">
      <a class="trip-back" href="#trips">‹ All photos</a>
      <span class="trip-bar-name" id="trip-bar-name"></span>
      <button class="theme-toggle" type="button" aria-label="Switch to black background">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="trip-body" id="trip-body"></div>
  </section>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top">
      <span class="lb-count" id="lb-count"></span>
      <button class="lb-close" aria-label="Close">×</button>
    </div>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next photo">›</button>
  </div>

  <script src="app.js?v=3d15ae6f"></script>
</body>
</html>
